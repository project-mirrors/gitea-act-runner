name: capacity
on: push
jobs:
  one:
    runs-on: e2e-capacity
    steps:
      - run: |
          echo "span-start=$(date +%s%N)"
          until curl -fs "${{ vars.E2E_GATE }}" > /dev/null; do sleep 0.1; done
          echo "span-end=$(date +%s%N)"
  two:
    runs-on: e2e-capacity
    steps:
      - run: |
          echo "span-start=$(date +%s%N)"
          until curl -fs "${{ vars.E2E_GATE }}" > /dev/null; do sleep 0.1; done
          echo "span-end=$(date +%s%N)"
