name: uses-docker-url
on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: printf 'workspace=from-host-step\n' > workspace-marker
      - uses: docker://node:24-bookworm-slim
        with:
          somekey: somevalue
          args: echo ${INPUT_SOMEKEY} | grep somevalue
      - uses: docker://node:24-bookworm-slim
        with:
          args: -v
      - uses: docker://node:24-bookworm-slim
        with:
          entrypoint: /bin/sh
          args: -c -- uname -a
      - id: workspace
        uses: docker://node:24-bookworm-slim
        with:
          entrypoint: /bin/sh
          args: -c 'uname -a && cat "$GITHUB_WORKSPACE/workspace-marker" >> "$GITHUB_OUTPUT"'
      - run: test '${{ steps.workspace.outputs.workspace }}' = 'from-host-step'

