on: push
env:
  MY_SHELL: bash
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: ${{ env.MY_SHELL }}
    steps:
      - shell: ${{ env.MY_SHELL }}
        run: |
          if [[ -n "$BASH" ]]; then
            echo "I'm $BASH!"
          else
            exit 1
          fi
      - run: |
          if [[ -n "$BASH" ]]; then
            echo "I'm $BASH!"
          else
            exit 1
          fi
  check-container:
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim
    steps:
      - shell: ${{ env.MY_SHELL }}
        run: |
          if [[ -n "$BASH" ]]; then
            echo "I'm $BASH!"
          else
            exit 1
          fi
